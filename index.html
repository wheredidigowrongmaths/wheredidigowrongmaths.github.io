<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Where Did I Go Wrong? | Maths</title>
<meta name="description" content="Your mistake. Our autopsy. Full marks next time. Tap-through lessons on the maths mistakes students make most.">
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Nunito:wght@800&display=swap">
<style>
:root{
  --ink:#1F2A44; --red:#E53935; --paper:#FFFBF0; --line:#D6E2F0; --margin:#F3B8B6; --green:#2E9E6B;
  --hand:"Bradley Hand","Chalkboard SE","Patrick Hand",cursive;
  --round:"Arial Rounded MT Bold","Nunito","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;font-family:var(--round);color:var(--ink);
  background:var(--paper) repeating-linear-gradient(to bottom,transparent 0 34px,var(--line) 34px 36px);
}
body::before{content:"";position:fixed;left:44px;top:0;bottom:0;width:2px;background:var(--margin)}
main{max-width:560px;margin:0 auto;padding:40px 16px 60px 64px}
.logo{display:block;width:120px;height:120px;border-radius:50%;margin:0 0 18px}
h1{font-size:32px;line-height:1.2;margin:0 0 8px}
h1 b{color:var(--red)}
.tag{font-family:var(--hand);font-weight:bold;font-size:24px;margin:0 0 32px}
h2{font-size:20px;letter-spacing:3px;margin:0 0 14px}
.ep{
  display:flex;align-items:center;gap:16px;padding:18px 20px;margin-bottom:14px;
  background:#fff;border:3px solid var(--ink);border-radius:18px;
  color:inherit;text-decoration:none;box-shadow:4px 4px 0 var(--ink);transition:transform .15s,box-shadow .15s;
}
.ep:hover,.ep:focus-visible{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.num{flex:none;background:var(--ink);color:var(--paper);border-radius:12px;padding:8px 12px;font-size:18px}
.ep .t{font-family:var(--hand);font-weight:bold;font-size:28px;line-height:1.1}
.ep .t s{color:var(--red);text-decoration-thickness:3px}
.ep .t .ok{color:var(--green)}
.ep .go{margin-left:auto;font-size:26px}
.soon{border-style:dashed;box-shadow:none;opacity:.6;pointer-events:none}
.links{margin-top:36px;display:flex;flex-wrap:wrap;gap:12px}
.links a{color:var(--paper);background:var(--red);text-decoration:none;padding:12px 18px;border-radius:40px;font-size:17px}
.links a.alt{background:var(--ink)}
footer{margin-top:40px;font-size:14px;opacity:.7}
@media (max-width:420px){ main{padding-left:56px} body::before{left:36px} .ep .t{font-size:24px} }
</style>
</head>
<body>
<main>
  <img class="logo" src="icon.png" alt="Where Did I Go Wrong? logo: a question mark in a red pen circle">
  <h1>Where Did I Go <b>Wrong?</b> | Maths</h1>
  <p class="tag">Your mistake. Our autopsy. Full marks next time.</p>

  <h2>MISTAKE AUTOPSIES</h2>
  <a class="ep" href="autopsy-01/">
    <span class="num">#1</span>
    <span class="t"><s>(a + b)² = a² + b²</s></span>
    <span class="go">👆</span>
  </a>
  <div class="ep soon">
    <span class="num">#2</span>
    <span class="t">Coming soon…</span>
  </div>

  <div class="links">
    <a href="send/">📸 Send your mistake</a>
    <a class="alt" href="https://www.youtube.com/@WhereDidIGoWrongMaths">▶ YouTube</a>
    <a class="alt" href="https://www.instagram.com/wheredidigowrong.maths/">Instagram</a>
  </div>

  <footer>Tap an autopsy to go through it at your own pace.</footer>
</main>
</body>
</html>
